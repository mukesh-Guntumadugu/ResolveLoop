# Drop this `location` block inside the existing `server { listen 443 ssl; server_name srv1619809.hstgr.cloud; ... }`
# block in /etc/nginx/conf.d/allergylens.conf (or include this file from there). It reuses that host's certificate.
# The prefix is passed through unchanged (no trailing slash on proxy_pass); the app strips it itself via RESOLVELOOP_ROOT_PATH=/resolveloop.
location /resolveloop/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /resolveloop;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 240s;
}
