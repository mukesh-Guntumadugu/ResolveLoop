# Drop this `location` block inside the existing `server { listen 443 ssl; server_name srv1619809.hstgr.cloud; ... }`
# block in /etc/nginx/conf.d/allergylens.conf (or include this file from there). It reuses that host's certificate.
# The app is started with RESOLVELOOP_ROOT_PATH=/resolveloop so generated docs and the UI know their prefix.
location /resolveloop/ {
    proxy_pass http://127.0.0.1:8790/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /resolveloop;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
}
